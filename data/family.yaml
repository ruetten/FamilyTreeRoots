# Each generation is the Ruetten father and the wife who bore the next Ruetten.
#
# Schema
#   root: <id>                        the person the line leads to
#   people:
#     - id: unique_key
#       name: Display Name
#       sex: M | F | ''
#       birth:  {date: YYYY[-MM[-DD]], place: <id from places.yaml>}
#       death:  {date: ..., place: ...}   omit entirely if unrecorded
#       parents: [id, id]                 0, 1 or 2 entries
#       residences:                       optional; where they were between events
#         - {from: YYYY[-MM[-DD]], place: <id>}
#
# Locations you do not record are inferred: a person is assumed to have been
# present at each of their children's births. That is what carries the family
# across the Atlantic between 1880 and 1889 without an explicit voyage record.

